name: PSP Homebrew CI & Nightly Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-psp:
    name: Build All PSP Homebrew Demos
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build All PSP Demos
        run: |
          mkdir -p dist
          export PKG_CONFIG_PATH="${PSPDEV}/psp/lib/pkgconfig:${PKG_CONFIG_PATH}"
          
          for dir in psp_projects/*/; do
            if [ -f "${dir}CMakeLists.txt" ]; then
              proj_name=$(basename "${dir}")
              echo "============================================="
              echo "==> Building ${proj_name}..."
              echo "============================================="
              
              mkdir -p "${dir}build"
              cd "${dir}build"
              
              if psp-cmake .. && make -j$(nproc); then
                echo "SUCCESS: ${proj_name} built successfully."
                if [ -f "EBOOT.PBP" ]; then
                  cp EBOOT.PBP "../../dist/${proj_name}_EBOOT.PBP"
                fi
              else
                echo "WARNING: ${proj_name} build encountered an issue. Continuing with other demos..."
              fi
              
              cd ../../
            fi
          done

      - name: Upload EBOOT Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psp-homebrew-nightly-eboot-pack
          path: dist/
          retention-days: 14
